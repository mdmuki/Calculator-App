name: Release Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Project Type Detection
      - name: Detect Project Type
        id: detect-project
        run: |
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "project_type=android" >> $GITHUB_OUTPUT
            echo "Detected Android project."
          elif [ -f "package.json" ]; then
            echo "project_type=node" >> $GITHUB_OUTPUT
            echo "Detected Web/Node.js project."
          else
            echo "project_type=generic" >> $GITHUB_OUTPUT
            echo "Detected Generic project."
          fi

      # 2. Android Build Pipeline
      - name: Set up JDK 17 (Temurin)
        if: steps:detect-project.outputs.project_type == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Android Keystore and Permissions
        if: steps:detect-project.outputs.project_type == 'android'
        run: |
          # Restore debug.keystore from base64 if present, or generate a standard debug keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback standard debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew executable permission
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        if: steps:detect-project.outputs.project_type == 'android'
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Android Artifact
        if: steps:detect-project.outputs.project_type == 'android'
        id: android-artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            echo "artifact_path=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "Fallback searching for any generated apk..."
            FALLBACK_APK=$(find . -name "*.apk" | head -n 1)
            echo "artifact_path=$FALLBACK_APK" >> $GITHUB_OUTPUT
          fi

      # 3. Web/Node.js Pipeline (if applicable)
      - name: Set up Node.js LTS
        if: steps:detect-project.outputs.project_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Build Web Application
        if: steps:detect-project.outputs.project_type == 'node'
        id: node-artifact
        run: |
          npm ci || npm install
          npm run build
          mkdir -p release-dist
          if [ -d "dist" ]; then
            zip -r release-dist/web-build.zip dist
          elif [ -d "build" ]; then
            zip -r release-dist/web-build.zip build
          elif [ -d ".next" ]; then
            zip -r release-dist/web-build.zip .next public package.json
          else
            zip -r release-dist/web-build.zip .
          fi
          echo "artifact_path=release-dist/web-build.zip" >> $GITHUB_OUTPUT

      # 4. Resolve Final Artifact
      - name: Resolve Release Artifact
        id: resolve-artifact
        run: |
          if [ "${{ steps.detect-project.outputs.project_type }}" == "android" ]; then
            echo "artifact_path=${{ steps.android-artifact.outputs.artifact_path }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.detect-project.outputs.project_type }}" == "node" ]; then
            echo "artifact_path=${{ steps.node-artifact.outputs.artifact_path }}" >> $GITHUB_OUTPUT
          else
            echo "artifact_path=" >> $GITHUB_OUTPUT
          fi

      # 5. Publish GitHub Release
      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.resolve-artifact.outputs.artifact_path }}
          tag: "v1.0.${{ github.run_number }}"
          name: "Calculator v1.0.${{ github.run_number }}"
          body: "Official automated production release ready for direct download and installation."
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
